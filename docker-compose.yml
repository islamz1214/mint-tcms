services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bala}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bala}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
    command: sh -c "npm install && npm run dev:api"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules
      - ./uploads:/app/uploads

  web:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    command: sh -c "npm install && npm run dev:web"
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules

volumes:
  postgres_data:
  api_root_node_modules:
  api_node_modules:
  web_root_node_modules:
  web_node_modules:
